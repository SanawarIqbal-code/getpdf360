<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Converter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #1f2328;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 520px;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .sub { margin: 0 0 24px; color: #57606a; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab {
      flex: 1;
      padding: 12px;
      border: 2px solid #d0d7de;
      border-radius: 10px;
      background: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active { border-color: #e5322d; background: #fff1f0; color: #e5322d; }
    .drop {
      border: 2px dashed #d0d7de;
      border-radius: 12px;
      padding: 36px 16px;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .drop.over { background: #fff1f0; border-color: #e5322d; }
    .drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .drop span { color: #57606a; font-size: 14px; }
    #fileName { margin-top: 12px; font-weight: 600; word-break: break-all; }
    .convert {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #e5322d;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .convert:disabled { background: #f0a3a1; cursor: not-allowed; }
    #status { margin-top: 16px; min-height: 22px; text-align: center; }
    #status.error { color: #cf222e; }
    #download {
      display: none;
      margin-top: 12px;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      background: #1a7f37;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PDF Converter</h1>
    <p class="sub">Convert Word to PDF and PDF to Word. Free and simple.</p>

    <div class="tabs">
      <button class="tab active" data-mode="word-to-pdf">Word → PDF</button>
      <button class="tab" data-mode="pdf-to-word">PDF → Word</button>
    </div>

    <div class="drop" id="drop">
      <strong>Drop your file here</strong>
      <span id="hint">or click to choose a .doc or .docx file</span>
      <div id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept=".doc,.docx" hidden>

    <button class="convert" id="convertBtn" disabled>Convert</button>
    <div id="status"></div>
    <a id="download" href="#">Download file</a>
  </div>

  <script>
    const modes = {
      "word-to-pdf": { accept: ".doc,.docx", hint: "or click to choose a .doc or .docx file", ext: ".pdf" },
      "pdf-to-word": { accept: ".pdf", hint: "or click to choose a .pdf file", ext: ".docx" }
    };
    let mode = "word-to-pdf";
    let selectedFile = null;

    const drop = document.getElementById("drop");
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const hint = document.getElementById("hint");
    const convertBtn = document.getElementById("convertBtn");
    const statusBox = document.getElementById("status");
    const download = document.getElementById("download");

    function reset() {
      selectedFile = null;
      fileInput.value = "";
      fileName.textContent = "";
      convertBtn.disabled = true;
      statusBox.textContent = "";
      statusBox.className = "";
      download.style.display = "none";
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        mode = tab.dataset.mode;
        fileInput.accept = modes[mode].accept;
        hint.textContent = modes[mode].hint;
        reset();
      });
    });

    function chooseFile(file) {
      if (!file) return;
      const name = file.name.toLowerCase();
      const allowed = modes[mode].accept.split(",");
      if (!allowed.some(ext => name.endsWith(ext))) {
        statusBox.textContent = "Please choose a " + modes[mode].accept + " file.";
        statusBox.className = "error";
        return;
      }
      selectedFile = file;
      fileName.textContent = file.name;
      convertBtn.disabled = false;
      statusBox.textContent = "";
      statusBox.className = "";
      download.style.display = "none";
    }

    drop.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => chooseFile(fileInput.files[0]));
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => {
      e.preventDefault();
      drop.classList.remove("over");
      chooseFile(e.dataTransfer.files[0]);
    });

    convertBtn.addEventListener("click", async () => {
      if (!selectedFile) return;
      convertBtn.disabled = true;
      download.style.display = "none";
      statusBox.className = "";
      statusBox.textContent = "Converting... please wait";

      const formData = new FormData();
      formData.append("file", selectedFile);

      try {
        const response = await fetch("/" + mode, { method: "POST", body: formData });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.detail || "Sorry, that file couldn't be converted.");
        }
        const blob = await response.blob();
        const baseName = selectedFile.name.replace(/\.[^.]+$/, "");
        download.href = URL.createObjectURL(blob);
        download.download = baseName + modes[mode].ext;
        download.style.display = "block";
        statusBox.textContent = "Done! Your file is ready.";
      } catch (err) {
        statusBox.textContent = err.message;
        statusBox.className = "error";
      } finally {
        convertBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
